<html lang="zh-CN">
<head>

<title>🍷 今天喝什么酒？</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', 'Songti SC', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2c1810 0%, #4a1942 50%, #1a0a2e 100%);
    color: #f5e6d3;
    padding: 20px;
    overflow: hidden;
  }

  .container {
    text-align: center;
    max-width: 420px;
    width: 100%;
  }

  h1 {
    font-size: 1.8em;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(255,150,100,0.3);
  }

  .subtitle {
    font-size: 0.9em;
    color: #c9a87c;
    margin-bottom: 30px;
  }

  /* ===== 碰杯区域 ===== */
  .cheers-area {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: 160px;
    position: relative;
    margin-bottom: 25px;
    gap: 18px;
  }

  /* ===== 酒杯 ===== */
  .glass {
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.3s ease;
    transform-origin: bottom center;
  }

  .glass-bowl {
    width: 58px;
    height: 50px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top: 2px solid rgba(255,255,255,0.15);
    border-radius: 4px 4px 50% 50%;
    position: relative;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
  }

  /* 玻璃反光 */
  .glass-bowl::after {
    content: '';
    position: absolute;
    top: 6px;
    left: 9px;
    width: 6px;
    height: 18px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    transform: rotate(-12deg);
    z-index: 2;
  }

  .glass-liquid {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 0%;
    border-radius: 0 0 50% 50%;
    transition: height 0.8s ease, background 0.4s ease;
  }

  .glass-stem {
    width: 3px;
    height: 30px;
    background: rgba(255,255,255,0.3);
  }

  .glass-foot {
    width: 38px;
    height: 5px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
  }

  /* 气泡（起泡酒用） */
  .bubbles {
    display: none;
    position: absolute;
    bottom: 0; left: 0; right: 0; top: 0;
    z-index: 1;
  }
  .bubbles.active { display: block; }
  .bubbles span {
    position: absolute;
    width: 3px;
    height: 3px;
    background: rgba(255,255,255,0.75);
    border-radius: 50%;
  }
  .bubbles.active span {
    animation: bubbleUp 2s infinite;
  }
  .bubbles span:nth-child(1) { left: 22%; animation-delay: 0s; animation-duration: 1.6s; }
  .bubbles span:nth-child(2) { left: 48%; animation-delay: 0.4s; animation-duration: 2s; }
  .bubbles span:nth-child(3) { left: 68%; animation-delay: 0.9s; animation-duration: 1.4s; }
  .bubbles span:nth-child(4) { left: 36%; animation-delay: 1.3s; animation-duration: 1.8s; }
  .bubbles span:nth-child(5) { left: 56%; animation-delay: 0.6s; animation-duration: 2.2s; }

  @keyframes bubbleUp {
    0%   { bottom: 2px; opacity: 0; transform: scale(0.4); }
    20%  { opacity: 0.8; }
    100% { bottom: 95%; opacity: 0; transform: scale(1); }
  }

  /* ===== 葡萄动画 ===== */
  .grape-icon {
    position: absolute;
    top: 0px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    font-size: 52px;
    opacity: 0;
    transition: none;
    z-index: 10;
    filter: drop-shadow(0 0 12px rgba(128,0,128,0.4));
  }

  .grape-icon.pop {
    animation: grapePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .grape-icon.fade {
    animation: grapeFade 0.5s ease forwards;
  }

  @keyframes grapePop {
    0%   { transform: translateX(-50%) scale(0) rotate(-20deg); opacity: 0; }
    100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
  }

  @keyframes grapeFade {
    0%   { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) scale(0.5) translateY(-20px); opacity: 0; }
  }

  /* ===== 碰杯动画 ===== */
  .cheers-area.clinking .glass-left {
    animation: tiltL 0.35s ease-in-out infinite alternate;
  }
  .cheers-area.clinking .glass-right {
    animation: tiltR 0.35s ease-in-out infinite alternate;
  }

  @keyframes tiltL {
    0%   { transform: rotate(0deg) translateX(0); }
    100% { transform: rotate(14deg) translateX(6px); }
  }
  @keyframes tiltR {
    0%   { transform: rotate(0deg) translateX(0); }
    100% { transform: rotate(-14deg) translateX(-6px); }
  }

  /* 碰上定格 */
  .cheers-area.clinked .glass-left {
    transform: rotate(14deg) translateX(6px);
    transition: transform 0.15s ease;
  }
  .cheers-area.clinked .glass-right {
    transform: rotate(-14deg) translateX(-6px);
    transition: transform 0.15s ease;
  }

  /* 结果定格（微倾） */
  .cheers-area.result .glass-left {
    transform: rotate(6deg) translateX(3px);
    transition: transform 0.6s ease;
  }
  .cheers-area.result .glass-right {
    transform: rotate(-6deg) translateX(-3px);
    transition: transform 0.6s ease;
  }

  /* ===== 结果卡片 ===== */
  .result-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 30px 25px;
    margin-bottom: 30px;
    min-height: 190px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.6s ease;
  }

  .result-card.show {
    opacity: 1;
    transform: translateY(0);
  }

  .result-card .type-badge {
    display: inline-block;
    padding: 6px 20px;
    border-radius: 20px;
    font-size: 1em;
    font-weight: bold;
    margin-bottom: 14px;
    letter-spacing: 2px;
  }

  .badge-red, .badge-fortified {
    background: rgba(139,0,0,0.7);
    border: 1px solid #cc3333;
    color: #ffcccc;
  }
  .badge-white, .badge-dessert {
    background: rgba(218,195,120,0.3);
    border: 1px solid #dac378;
    color: #fff5d4;
  }
  .badge-rose {
    background: rgba(219,112,147,0.4);
    border: 1px solid #db7093;
    color: #ffe4ed;
  }
  .badge-sparkling {
    background: rgba(255,215,0,0.3);
    border: 1px solid #ffd700;
    color: #fff8dc;
  }

  .grape { font-size: 1.5em; font-weight: bold; margin-bottom: 6px; }
  .region { font-size: 1.05em; color: #c9a87c; margin-bottom: 12px; }
  .flavor {
    font-size: 0.85em;
    color: #b89a7e;
    line-height: 1.6;
    margin-bottom: 14px;
    padding: 0 10px;
  }
  .quote {
    font-size: 0.95em;
    color: #e8c9a0;
    font-style: italic;
    line-height: 1.6;
    padding: 10px 15px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .placeholder-text {
    color: #887766;
    font-size: 1.1em;
    line-height: 1.8;
  }

  /* ===== 按钮 ===== */
  .btn {
    background: linear-gradient(135deg, #8b2252, #c0392b);
    color: white;
    border: none;
    padding: 16px 50px;
    font-size: 1.2em;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 3px;
    box-shadow: 0 4px 25px rgba(192,57,43,0.4);
    transition: all 0.3s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(192,57,43,0.6);
  }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .history {
    margin-top: 28px;
    font-size: 0.75em;
    color: #776655;
  }
  .history span {
    display: inline-block;
    margin: 3px;
    padding: 3px 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
  }
</style>
</head>

/* ====== 颜色映射 ====== */
const liquidColors = {
  'badge-red':       'rgba(110, 8, 20, 0.88)',
  'badge-fortified': 'rgba(110, 8, 20, 0.88)',
  'badge-white':     'rgba(235, 215, 120, 0.72)',
  'badge-dessert':   'rgba(235, 215, 120, 0.72)',
  'badge-sparkling': 'rgba(240, 230, 160, 0.55)',
  'badge-rose':      'rgba(220, 110, 140, 0.65)'
};

/* ====== DOM ====== */
const cheers    = document.getElementById('cheersArea');
const grapeEl   = document.getElementById('grapeIcon');
const liquidL   = document.getElementById('liquidL');
const liquidR   = document.getElementById('liquidR');
const bubblesL  = document.getElementById('bubblesL');
const bubblesR  = document.getElementById('bubblesR');
const card      = document.getElementById('resultCard');
const btn       = document.getElementById('drawBtn');

let isDrawing   = false;
let historyList = [];

/* ====== 重置 ====== */
function resetGlasses () {
  cheers.classList.remove('clinking', 'clinked', 'result');
  grapeEl.classList.remove('pop', 'fade');
  grapeEl.style.opacity = '0';
  liquidL.style.height = '0';
  liquidR.style.height = '0';
  liquidL.style.background = 'transparent';
  liquidR.style.background = 'transparent';
  bubblesL.classList.remove('active');
  bubblesR.classList.remove('active');
  card.classList.remove('show');
}

/* ====== 抽签 ====== */
function draw () {
  if (isDrawing) return;
  isDrawing = true;
  btn.disabled = true;

  resetGlasses();

  /* 微延迟让 reset 生效 */
  setTimeout(() => {

    /* ── Phase 1 : 碰杯摇晃 ── */
    cheers.classList.add('clinking');

    setTimeout(() => {
      /* ── Phase 2 : 碰上 + 葡萄弹出 ── */
      cheers.classList.remove('clinking');
      cheers.classList.add('clinked');
      grapeEl.classList.remove('fade');
      grapeEl.classList.add('pop');

      setTimeout(() => {
        /* ── Phase 3 : 选酒、倒酒、出结果 ── */
        const wine  = wines[Math.floor(Math.random() * wines.length)];
        const color = liquidColors[wine.badge];

        /* 葡萄淡出 */
        grapeEl.classList.remove('pop');
        grapeEl.classList.add('fade');

        /* 杯子微倾 */
        cheers.classList.remove('clinked');
        cheers.classList.add('result');

        /* 倒酒 */
        liquidL.style.background = color;
        liquidR.style.background = color;
        liquidL.style.height = '68%';
        liquidR.style.height = '68%';

        /* 起泡酒气泡 */
        if (wine.badge === 'badge-sparkling') {
          bubblesL.classList.add('active');
          bubblesR.classList.add('active');
        }

        /* 结果卡片 */
        setTimeout(() => {
          card.innerHTML = `
            <span class="type-badge ${wine.badge}">${wine.type}</span>
            <div class="grape">${wine.grape}</div>
            <div class="region">${wine.region}</div>
            <div class="flavor">「${wine.flavor}」</div>
            <div class="quote">${wine.quote}</div>
          `;
          card.classList.add('show');

          historyList.unshift(wine.grape.split(' ')[0]);
          if (historyList.length > 5) historyList.pop();
          document.getElementById('history').innerHTML =
            historyList.length > 1
              ? '最近抽到：' + historyList.map(h => `<span>${h}</span>`).join('')
              : '';

          btn.disabled  = false;
          btn.textContent = '🎲 再来一签';
          isDrawing = false;
        }, 700);

      }, 850);
    }, 1200);
  }, 80);
}
